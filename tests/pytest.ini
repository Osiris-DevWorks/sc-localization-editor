[pytest]
# Pytest configuration for SC Localization Editor v0.6.0

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use file I/O, external tools)
    slow: Slow running tests (P4K extraction, large file operations)
    critical: Critical features that must pass (data loading, merging, stats, apply)
    regression: Tests for previously found bugs

# Coverage options (if coverage.py installed)
# --cov=src --cov-report=html --cov-report=term

# Test paths
testpaths = tests

# Timeout for tests (in seconds)
# timeout = 300

# Python path
pythonpath =
    ..
    ..\src
