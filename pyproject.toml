[project]
name = "open-strings"
version = "1.1.2"
description = "Open Strings desktop app"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [{name = "Joni Hayes"}]
dependencies = [
    "PyQt6>=6.11.0",
]

[project.scripts]
open-strings = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.20",
    "ruff>=0.15.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.15.0",
    "pytest-xdist>=3.8.0",
    "pytest-qt>=4.5.0",
    "pyinstaller>=6.20.0",
    "pre-commit>=4.6.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyqt6"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=65",
    "--timeout=30",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may use file I/O, external tools)",
    "slow: Slow running tests (P4K extraction, large file operations)",
    "critical: Critical features that must pass (data loading, merging, stats, apply)",
    "regression: Tests for previously found bugs",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/gui/main_window.py",
    "src/gui/config_tab.py",
    "src/gui/enhancements_tab.py",
    "src/gui/import_dialog.py",
    "src/gui/log_tab.py",
    "src/gui/coach_mark.py",
    "src/gui/markdown_renderer.py",
    "src/gui/filter_header.py",
    "src/gui/theme.py",
    "src/gui/workers.py",
    "src/gui/__init__.py",
    "src/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

